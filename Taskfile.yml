version: '3'

tasks:
  build:
    desc: Build the CLI binary for the current platform
    cmds:
      - go build -o bin/crossmem ./cmd/crossmem

  test:
    desc: Run Go tests
    cmds:
      - go test ./...

  lint:
    desc: Run go vet
    cmds:
      - go vet ./...

  ci:
    desc: Run local CI checks
    cmds:
      - go test ./...
      - go vet ./...
      - go build -o bin/crossmem ./cmd/crossmem
      - ./bin/crossmem --version
      - ./bin/crossmem --help

  snapshot:
    desc: Build a local multi-platform snapshot
    cmds:
      - goreleaser release --snapshot --clean --skip=publish

  release:dry-run:
    desc: Dry-run GoReleaser
    cmds:
      - goreleaser release --snapshot --clean --skip=publish --verbose

  release:
    desc: 'Cut a release: task release -- 0.2.2 (syncs npm versions, tags, pushes)'
    vars:
      VERSION: '{{ .CLI_ARGS }}'
    preconditions:
      - sh: '[ -n "{{ .VERSION }}" ]'
        msg: 'usage: task release -- 0.2.2'
      - sh: '[ -z "$(git status --porcelain)" ]'
        msg: 'working tree is dirty; commit or stash first'
      - sh: '[ -z "$(git tag --list v{{ .VERSION }})" ]'
        msg: 'tag v{{ .VERSION }} already exists'
    cmds:
      - task: ci
      - ./scripts/set-version.sh {{ .VERSION }}
      - git add npm
      - 'git commit -m "release v{{ .VERSION }}"'
      - git tag -a v{{ .VERSION }} -m "v{{ .VERSION }}"
      - git push origin HEAD
      - git push origin v{{ .VERSION }}
      - echo "pushed v{{ .VERSION }} - the release workflow builds the GitHub release and publishes npm"
